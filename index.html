<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ТВ программа</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
</head>
<body>
  <div id="app">
    <header class="header">
      <button id="btn-menu" class="btn-icon" aria-label="Меню">☰</button>
      <h1 id="header-title">ТВ программа</h1>
      <button id="btn-search" class="btn-icon" aria-label="Поиск">🔍</button>
    </header>

    <main id="main" class="main">
      <div id="view-home" class="view active">
        <div class="empty-state">
          <div class="empty-icon">📺</div>
          <p>Загрузите источник EPG<br>в меню «Источники»</p>
          <button id="btn-go-sources" class="btn primary">Открыть источники</button>
        </div>
      </div>

      <div id="view-channels" class="view">
        <div id="channels-toolbar" class="toolbar">
          <input type="text" id="filter-channels" placeholder="Фильтр каналов..." autocomplete="off">
          <button id="btn-fav-only" class="btn small">★ Избранные</button>
        </div>
        <div id="channels-list" class="list"></div>
      </div>

      <div id="view-programmes" class="view">
        <div id="programmes-header" class="programmes-header"></div>
        <div id="programmes-list" class="list programmes"></div>
      </div>

      <div id="view-search" class="view">
        <div class="search-box">
          <div class="search-input-wrap">
            <input type="text" id="search-input" placeholder="Жанр, фильм, канал, страна..." autocomplete="off">
            <button id="btn-do-search" class="btn small">Найти</button>
          </div>
          <div id="search-history" class="search-history"></div>
        </div>
        <div id="search-results" class="list programmes"></div>
      </div>

      <div id="view-sources" class="view">
        <div id="storage-bar" class="storage-bar">
          <div class="storage-info" id="storage-info">Память: …</div>
          <div class="storage-actions">
            <button id="btn-clear-epg" class="btn small danger">Очистить EPG</button>
            <button id="btn-clear-cache" class="btn small danger">Сбросить базу</button>
          </div>
        </div>
        <div id="sources-list" class="sources-list"></div>
        <div class="add-source-block">
          <h3>Добавить свой источник</h3>
          <div class="input-with-history">
            <input type="url" id="custom-url" placeholder="https://example.com/epg.xml.gz" list="url-history" autocomplete="off">
            <datalist id="url-history"></datalist>
          </div>
          <input type="text" id="custom-name" placeholder="Название (необязательно)" autocomplete="off" class="name-input">
          <div class="days-select">
            <label><input type="radio" name="days" value="1"> 1 день</label>
            <label><input type="radio" name="days" value="3" checked> 3 дня</label>
            <label><input type="radio" name="days" value="7"> 7 дней</label>
          </div>
          <button id="btn-add-source" class="btn primary">Загрузить</button>
        </div>
      </div>

      <div id="view-source-channels" class="view">
        <div class="toolbar">
          <button id="btn-back-sources" class="btn small">← Назад</button>
          <span id="source-channels-title"></span>
        </div>
        <div id="source-channels-list" class="list"></div>
      </div>
    </main>

    <nav id="side-menu" class="side-menu">
      <div class="side-menu-header">
        <span>ТВ программа</span>
        <span class="version" id="app-version">v1.2.0</span>
      </div>
      <ul>
        <li data-view="channels">Каналы</li>
        <li id="menu-favorites">Избранное</li>
        <li data-view="search">Поиск</li>
        <li data-view="sources">Источники EPG</li>
      </ul>
      <div class="side-menu-footer">
        <small>Тёмная тема · Минимализм</small>
      </div>
    </nav>
    <div id="menu-overlay" class="overlay"></div>

    <div id="toast" class="toast"></div>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p id="loading-text">Загрузка...</p>
      <div id="loading-bar-wrap" class="loading-bar-wrap">
        <div id="loading-bar" class="loading-bar"></div>
      </div>
      <p id="loading-pct" class="loading-pct"></p>
    </div>

    <div id="rename-modal" class="modal hidden">
      <div class="modal-box">
        <h3>Название источника</h3>
        <input type="text" id="rename-input" autocomplete="off">
        <div class="modal-actions">
          <button id="rename-cancel" class="btn">Отмена</button>
          <button id="rename-ok" class="btn primary">Сохранить</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/epg.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
