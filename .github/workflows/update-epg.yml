name: Update EPG

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create epg folder
        run: mkdir -p epg

      - name: Download 1lot.tv EPG
        run: |
          echo "Downloading 1lot.tv EPG..."
          curl -L --fail --retry 3 --retry-delay 5 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -o epg/1lot.xml.gz \
            "https://1lot.tv/epg/epg.xml.gz"
          ls -lh epg/1lot.xml.gz

      - name: Download gabbarit EPG
        run: |
          echo "Downloading gabbarit EPG..."
          curl -L --fail --retry 3 --retry-delay 5 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -H "Accept: application/octet-stream,*/*" \
            -H "Accept-Language: ru-RU,ru;q=0.9,en;q=0.8" \
            -o epg/gabbarit.xml.gz \
            "https://gabbarit.drm-play.com/epg_1.xml.gz"
          ls -lh epg/gabbarit.xml.gz

      - name: Merge EPG (1lot priority, 7 days → fallback 3)
        run: |
          python3 scripts/merge_epg.py epg/1lot.xml.gz epg/gabbarit.xml.gz epg/merged.xml.gz
          ls -lh epg/
          cat epg/merged.meta.txt || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add epg/ scripts/merge_epg.py
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update EPG merged $(date -u +%Y-%m-%d)"
            git push
          fi
