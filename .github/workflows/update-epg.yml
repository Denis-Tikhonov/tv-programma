name: Update EPG

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create epg folder
        run: mkdir -p epg

      - name: Download 1lot.tv EPG
        run: |
          echo "Downloading 1lot.tv EPG..."
          curl -L --fail --retry 3 --retry-delay 5 \
            -o epg/1lot.xml.gz \
            "https://1lot.tv/epg/epg.xml.gz"
          ls -lh epg/1lot.xml.gz

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add epg/
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update EPG $(date -u +%Y-%m-%d)"
            git push
          fi
